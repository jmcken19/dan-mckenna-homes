# Dan McKenna Homes – owner editor (Cloudflare Worker, free plan).
# Setup steps: see docs/MAINTAINER.md → "Connect the editor".
name = "dmh-owner"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./ui"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dmh-owner"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PHOTOS"
id = "REPLACE_WITH_KV_ID"

[vars]
GITHUB_REPO = "jmcken19/dan-mckenna-homes"
GITHUB_BRANCH = "main"
# Where the public site lives. Preview now; change to https://www.danmckennahomes.com at launch.
PUBLIC_SITE_URL = "https://jmcken19.github.io/dan-mckenna-homes"
# Cloudflare Access: your team domain (e.g. "dmh.cloudflareaccess.com", https:// optional) and the AUD tag.
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"
SUPPORT_NAME = "James McKenna"

# Private settings – set with `npx wrangler secret put NAME` (kept out of this public repo):
#   GITHUB_TOKEN       fine-grained token, this repo only (Contents RW, Actions RW)
#   RESEND_API_KEY     OPTIONAL – only if change requests should also be emailed (with NOTIFY_TO)
#   OWNER_EMAILS       Dan's sign-in email(s), comma-separated
#   MAINTAINER_EMAILS  James's sign-in email
#   NOTIFY_TO          OPTIONAL – where change requests are emailed
#   SUPPORT_EMAIL      shown to Dan as his help contact
#   SUPPORT_PHONE      shown to Dan as his help contact (optional)
