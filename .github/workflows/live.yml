name: Publish live website (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the live website (classic design)
        run: node scripts/build.mjs
        env:
          OUT_DIR: dist-prod
          SITE_URL: https://www.danmckennahomes.com
          BUILD_ID: ${{ github.sha }}
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set yet – live deploy skipped (see docs/MAINTAINER.md)."
            exit 0
          fi
          cd site && npx wrangler deploy
