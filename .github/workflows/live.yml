name: Publish live website (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the live website (classic design)
        run: node scripts/build.mjs
        env:
          OUT_DIR: dist-prod
          SITE_URL: https://www.danmckennahomes.com
          BUILD_ID: ${{ github.sha }}
      # Safety: the new contact form (content/site.json → turnstileSiteKey) may only go live when the Worker that is
      # live right now already has its secrets and email binding. Otherwise stop here – the website stays as it is.
      - name: Contact form – is the Worker ready?
        run: |
          KEY=$(node -p "require('./content/site.json').turnstileSiteKey || ''")
          if [ -z "$KEY" ]; then echo "turnstileSiteKey not set – the website keeps the FormSubmit form."; exit 0; fi
          READY=$(curl -fsS --max-time 20 https://www.danmckennahomes.com/api/contact || true)
          echo "GET /api/contact → $READY"
          if [ "$READY" != '{"ready":true}' ]; then
            echo "::error::turnstileSiteKey is set, but the live Worker is not ready for the new contact form (secrets / send_email binding – docs/MAINTAINER.md → Contact form). Nothing was deployed."
            exit 1
          fi
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set yet – live deploy skipped (see docs/MAINTAINER.md)."
            exit 0
          fi
          cd site && npx wrangler deploy
